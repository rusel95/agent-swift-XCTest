# SauceLabs XCUITest Configuration
#
# Example saucectl config for running parallel XCUITests on real iOS devices.
# Used with the ReportPortal Swift XCTest Agent's merge workflow.
#
# Usage:
#   saucectl run --config .sauce/config.yml
#
# ⚠️  IMPORTANT: The `env:` YAML property does NOT inject environment variables
# into the XCUITest process on real devices. This is a confirmed SauceLabs
# limitation (https://github.com/saucelabs/saucectl/issues/398).
#
# The `env:` values below are only used for saucectl's own YAML variable
# expansion (e.g., resolving $APP paths), NOT passed to the device.
#
# To pass configuration to the agent on real devices, inject it into the test target's
# Info.plist at BUILD time (before xcodebuild; patching the signed bundle breaks code signing):
#   - ReportPortalMergeGroup = a RUN-UNIQUE value, e.g. regression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
# Leave ReportPortalSkipFinish unset — let each device finalize its own launch; the merge step
# combines them afterwards.
#
# See docs/SAUCELABS_SETUP.md for the full setup guide.

apiVersion: v1alpha
kind: xcuitest

sauce:
  region: us-west-1
  concurrency: 2

xcuitest:
  app: ./build/Example.ipa
  testApp: ./build/ExampleUITests-Runner.ipa

suites:
  - name: "Regression - Real Devices"
    devices:
      - name: "iPhone 16"
        platformVersion: "18.0"
      - name: "iPhone 15 Pro"
        platformVersion: "17.0"
    shard: concurrency
    # env:
    #   RP_MERGE_GROUP: "regression"     # ❌ Does NOT reach XCUITest process
    #   RP_SKIP_FINISH: "true"           # ❌ Does NOT reach XCUITest process
    #   RP_LAUNCH_UUID: "some-uuid"      # ❌ Does NOT reach XCUITest process
    #
    # Use Info.plist keys instead (see comment at top of file).
